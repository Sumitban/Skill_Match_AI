
[tool.pytest.ini_options]
pythonpath = ["."]

# Describing the test paths
testpaths = ["tests"]

# API Configuration
[Setting]
APP_NAME = "Skill Match AI"
APP_VERSION = "1.0.0"
DEBUG = false

[tool.fastapi]
entrypoint = "Backened.app.api.main:app" 

# Database Configuration
[Database]
MONGO_URL = "mongodb://localhost:27017/"
DATABASE_NAME = "skill_match_AI"
MONGO_TIMEOUT_MS = 5000
MONGO_CONNECT_TIMEOUT_MS = 10000

# GitHub API Configuration
[GitHub]
GITHUB_API_KEY = ""
GITHUB_API_BASE = "https://api.github.com"
GITHUB_PER_PAGE = 100

# Embedding Configuration
[Embedding]
MODEL_NAME= "all-MiniLM-L6-v2"


# ML Model Configuration
[Model]
MODEL_PATH = "model.pkl"
XGB_N_ESTIMATORS = 100
XGB_MAX_DEPTH = 4
XGB_LEARNING_RATE = 0.1

# Feature Weights for Baseline Ranker
[Ranker]
WEIGHT_RESUME_SIM = 0.4
WEIGHT_SKILLS_SIM = 0.3
WEIGHT_GITHUB_SIM = 0.2
WEIGHT_YEARS_EXP = 0.1
MAX_YEARS_EXPERIENCE = 10

# Section Confidence Threshold
[Threshold]
CONFIDENCE_THRESHOLD = 0.6
MIN_SKILLS_LENGTH = 30
MIN_EXPERIENCE_LENGTH = 100
MIN_EDUCATION_LENGTH = 20

# GitHub Features
[Github_Feature]
TOP_REPOS_COUNT = 3

# Logging Configuration
[Logging]
LOG_LEVEL = "INFO"
LOG_FILE_PATH = "logs/app.log"
LOG_MAX_BACKUP_COUNT = 7

# API Response Configuration
[API]
RESPONSE_TIMEOUT_SECONDS = 30
MAX_RESUME_FILE_SIZE_MB = 10

